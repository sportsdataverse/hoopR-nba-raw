name: tests

# Offline test gate. Without this the suite only ran on a developer's machine:
# a broken import or a stale CLI contract would ship and be discovered by the
# next scrape run instead of the PR that caused it. These tests touch no network.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The nba/ archive is hundreds of thousands of committed JSON files; a
          # full checkout spends its time cloning payloads no test reads.
          # Sparse-checkout the code only -- archive-backed tests are marked
          # `archive` and deselected below.
          sparse-checkout: |
            python
            tests
            scripts
            pyproject.toml
            uv.lock
          sparse-checkout-cone-mode: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'
          cache-dependency-glob: uv.lock

      - name: Install
        # --frozen: a PR must not silently re-resolve the lockfile.
        run: uv sync --frozen --dev

      - name: Tests
        # --no-sync: `uv run` would otherwise re-sync and undo the --frozen
        # install above. `archive` tests read the committed nba/ tree, which
        # isn't checked out here.
        run: uv run --no-sync pytest -q -m "not archive"

      - name: Lint
        run: uv run --no-sync ruff check python tests

      - name: Shell syntax
        # scripts/ is bash-only by convention; the scrape entry points are not
        # otherwise exercised by CI.
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || exit 1
          done
